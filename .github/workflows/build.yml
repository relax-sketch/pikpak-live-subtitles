name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 仓库里不放 gradle-wrapper.jar，直接用 CI 提供的 Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/LiveTranslate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-apk
          path: out/LiveTranslate.apk

      # 固定发到 latest 这个 tag，手机浏览器打开就能直接下载安装
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            实时屏幕翻译字幕 —— 自动构建。
            提交：${{ github.sha }}
          files: out/LiveTranslate.apk
          prerelease: true
